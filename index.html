<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>综合日报观察台</title>
<style>
:root{--bg:#f4f5f7;--ink:#181b20;--ink3:#858d98;--line:#e4e7eb;--accent:#5148b8;--surface:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 18px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.brand{font-weight:750;letter-spacing:-.3px}
.brand span{color:var(--ink3);font-weight:500;font-size:13px;margin-left:8px}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.edition{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.edition button{border:0;background:transparent;padding:7px 14px;font-weight:650;color:var(--ink);cursor:pointer}
.edition button.active{background:var(--accent);color:#fff}
select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:650;color:var(--ink)}
iframe{width:100%;height:calc(100vh - 54px);border:0;background:#fff}
</style>
</head>
<body>
<div class="bar">
  <div class="brand">综合日报观察台 <span id="status">加载中</span></div>
  <div class="controls">
    <div class="edition" aria-label="日报周报切换">
      <button type="button" id="btn-daily" class="active">日报</button>
      <button type="button" id="btn-weekly">周报</button>
    </div>
    <label><span id="sel-label">日期</span> <select id="dates"></select></label>
  </div>
</div>
<iframe id="frame" title="综合日报"></iframe>
<script>
const frame = document.getElementById('frame');
const sel = document.getElementById('dates');
const status = document.getElementById('status');
const selLabel = document.getElementById('sel-label');
const btnDaily = document.getElementById('btn-daily');
const btnWeekly = document.getElementById('btn-weekly');
let mode = 'daily';
let dates = [];
let weeks = [];
let latestDaily = '';
let latestWeek = '';

function isoWeekFromDate(ymd) {
  const p = ymd.split('-');
  const d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const week = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return d.getUTCFullYear() + '-W' + String(week).padStart(2, '0');
}

function lastDateOfWeek(weekId) {
  const m = weekId.match(/^(\d{4})-W(\d{2})$/);
  if (!m) return null;
  const y = +m[1], w = +m[2];
  const simple = new Date(Date.UTC(y, 0, 1 + (w - 1) * 7));
  const dow = simple.getUTCDay();
  const monday = new Date(simple);
  if (dow <= 4) monday.setUTCDate(simple.getUTCDate() - dow + 1);
  else monday.setUTCDate(simple.getUTCDate() + 8 - dow);
  const sunday = new Date(monday);
  sunday.setUTCDate(monday.getUTCDate() + 6);
  return sunday.toISOString().slice(0, 10);
}

function fillSelect(items, value) {
  sel.innerHTML = '';
  items.forEach(d => {
    const o = document.createElement('option');
    o.value = d; o.textContent = d;
    sel.appendChild(o);
  });
  if (value && items.includes(value)) sel.value = value;
  else if (items[0]) sel.value = items[0];
}

function setMode(next, id) {
  mode = next;
  btnDaily.classList.toggle('active', mode === 'daily');
  btnWeekly.classList.toggle('active', mode === 'weekly');
  selLabel.textContent = mode === 'daily' ? '日期' : '周次';
  if (mode === 'daily') {
    const pick = (id && dates.includes(id)) ? id : latestDaily;
    fillSelect(dates, pick);
    openIssue(pick);
  } else {
    const pick = (id && weeks.includes(id)) ? id : latestWeek;
    fillSelect(weeks, pick);
    openIssue(pick);
  }
}

function openIssue(id) {
  if (!id) return;
  if (mode === 'daily') {
    frame.src = 'daily/' + id + '.html';
    status.textContent = id;
    const u = new URL(location.href);
    u.searchParams.set('date', id);
    u.searchParams.delete('week');
    history.replaceState(null, '', u);
  } else {
    frame.src = 'weekly/' + id + '.html';
    status.textContent = id;
    const u = new URL(location.href);
    u.searchParams.set('week', id);
    u.searchParams.delete('date');
    history.replaceState(null, '', u);
  }
}

Promise.all([
  fetch('dates.json').then(r => r.json()),
  fetch('weeks.json').then(r => r.json()).catch(() => ({weeks: [], latest: ''}))
]).then(([dIdx, wIdx]) => {
  dates = dIdx.dates || [];
  weeks = wIdx.weeks || [];
  latestDaily = dIdx.latest || dates[0];
  latestWeek = wIdx.latest || weeks[0];
  const q = new URLSearchParams(location.search);
  const qWeek = q.get('week');
  const qDate = q.get('date');
  if (qWeek) {
    const week = weeks.includes(qWeek) ? qWeek : latestWeek;
    setMode('weekly', week);
  } else if (qDate && dates.includes(qDate)) {
    setMode('daily', qDate);
  } else {
    setMode('daily', latestDaily);
  }
});

sel.addEventListener('change', () => openIssue(sel.value));
btnDaily.addEventListener('click', () => {
  if (mode === 'daily') return;
  const week = sel.value;
  const end = lastDateOfWeek(week);
  let pick = latestDaily;
  if (end && dates.includes(end)) pick = end;
  else {
    const hit = dates.find(d => isoWeekFromDate(d) === week);
    if (hit) pick = hit;
  }
  setMode('daily', pick);
});
btnWeekly.addEventListener('click', () => {
  if (mode === 'weekly') return;
  const date = sel.value;
  const want = isoWeekFromDate(date);
  setMode('weekly', weeks.includes(want) ? want : latestWeek);
});
</script>
</body>
</html>
