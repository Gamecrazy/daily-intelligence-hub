<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>综合日报观察台</title>
<style>
:root{--bg:#f4f5f7;--ink:#181b20;--ink3:#858d98;--line:#e4e7eb;--accent:#5148b8;--surface:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 18px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.brand{font-weight:750;letter-spacing:-.3px}
.brand span{color:var(--ink3);font-weight:500;font-size:13px;margin-left:8px}
select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:650;color:var(--ink)}
iframe{width:100%;height:calc(100vh - 54px);border:0;background:#fff}
</style>
</head>
<body>
<div class="bar">
  <div class="brand">综合日报观察台 <span id="status">加载中</span></div>
  <label>日期 <select id="dates"></select></label>
</div>
<iframe id="frame" title="综合日报"></iframe>
<script>
const frame = document.getElementById('frame');
const sel = document.getElementById('dates');
const status = document.getElementById('status');
function openDate(d){
  frame.src = 'daily/' + d + '.html';
  status.textContent = d;
  const u = new URL(location.href);
  u.searchParams.set('date', d);
  history.replaceState(null, '', u);
}
fetch('dates.json').then(r => r.json()).then(idx => {
  idx.dates.forEach(d => {
    const o = document.createElement('option');
    o.value = d; o.textContent = d;
    sel.appendChild(o);
  });
  const q = new URLSearchParams(location.search).get('date');
  const first = (q && idx.dates.includes(q)) ? q : idx.latest;
  sel.value = first;
  openDate(first);
});
sel.addEventListener('change', () => openDate(sel.value));
</script>
</body>
</html>
